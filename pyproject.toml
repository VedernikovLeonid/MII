[tool.poetry]
name = "lab1-pandas-visualization"
version = "0.1.0"
description = "Лабораторная работа 1: анализ данных с Pandas и визуализация"
authors = ["Student <student@example.com>"]
readme = "README.md"
packages = []

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
pandas = ">=2.2,<3.0"
numpy = ">=2.0,<3.0"
matplotlib = ">=3.9,<4.0"
seaborn = ">=0.13,<1.0"
scikit-learn = ">=1.5,<2.0"
imbalanced-learn = ">=0.12,<1.0"
jupyter = ">=1.1,<2.0"
nbformat = ">=5.10,<6.0"
nbclient = ">=0.10,<1.0"
ipykernel = ">=6.29,<7.0"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.6,<1.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
